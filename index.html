<!-- Web-Test des Dioramas: GLB aus 3d/web/diorama.py (Licht in Blender gebacken), eigener Voxel-Shader,
     Kreisfahrt, Läden in der Übersicht hervorheben (GPU-Picking, asynchron), Klick fliegt in den Raum, dort sanft
     umsehen, ✕ HOME. Runde Marker über den Läden (beim Rundflug sichtbar, verdeckte blenden aus), im Laden eine
     Infokarte (EN/DE), ‹ › bzw. Pfeiltasten blättern durch die Läden. Ohne WebGL oder wenn die Gasse nicht lädt: ein
     Standbild mit Liste und Karten (Runde 43, Test mit ?standbild). Läuft über den Vorschau-Server (Name
     „prototypes“), weil GLB und JSON per fetch geladen werden. -->
<style>
  /* Grundfarbe (Hintergrund, Nebel, Boden um den Block): Pfirsich warm, Florians Wahl in Runde 50 (wie komplex.BG).
     Livegang D: die Testknöpfe (Blender-Bild, Drehen, Voxelraster, Farbe zum Vergleichen) und die Zeile mit den
     Kennzahlen sind raus (Florian), oben links bleibt nur „✕ HOME“ aus der Nähe */
  :root { --hg: #FFC8A4; }
  :root { --ink: #3a2a35; --card: rgba(255, 250, 252, .9); --line: #f2c2d2; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--hg); color: var(--ink);
    font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  #hud button { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  #home { display: none; }
  /* Ladebildschirm (Runde 38): Hintergrund wie die Szene; sieben Punkte wie die Marker, je Station einer, sie färben
     sich mit dem Fortschritt nacheinander in ihre Ladenfarbe (--f). Bis das Modul läuft, hüpfen sie nacheinander. Mit
     dem ersten Bild blendet er aus (.weg); bei einem Fehler Meldung und „Neu laden“ (.fehler). */
  #laden { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px;
    background: var(--hg); color: #2d2b45; text-align: center; font: 16px/1.4 'Hanken Grotesk', system-ui, sans-serif;
    transition: opacity .7s; }
  #laden.weg { opacity: 0; pointer-events: none; }
  #laden .punkte { display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; }
  #laden .punkte i { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 3px 10px rgba(45, 43, 69, .22); transition: background-color .35s, transform .35s; }
  #laden .punkte i::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #2d2b45;
    transition: background-color .35s; }
  #laden .punkte i.an { background: var(--f, #2d2b45); transform: scale(1.18); }
  #laden .punkte i.an::after { background: #fff; }
  #laden:not(.laeuft):not(.fehler) .punkte i { animation: hopsen 1.6s ease-in-out infinite; }
  @keyframes hopsen { 0%, 50%, 100% { transform: none; } 25% { transform: translateY(-9px); } }
  #laden .titel { margin: 8px 0 6px; font-weight: 800; font-size: clamp(34px, 9vw, 52px); line-height: 1.05;
    letter-spacing: -.02em; }
  #laden .rolle { margin-bottom: 18px; font-size: 16px; font-weight: 700; color: #5e4553; }   /* Florian, Runde 39 */
  #laden .status { min-height: 1.4em; font-size: 15px; color: #5e4553; font-variant-numeric: tabular-nums; }
  #laden .nochmal { margin-top: 18px; padding: 12px 22px; border: 0; border-radius: 999px; background: #2d2b45;
    color: #fff; font: 800 15px/1 'Hanken Grotesk', system-ui, sans-serif; cursor: pointer; }
  #laden .tipp { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); box-sizing: border-box;
    width: max-content; max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px;
    background: rgba(255, 249, 242, .85); font-size: 14px; color: #5e4553; }
  #laden.fehler .tipp { display: none; }
  /* Marker über den Läden (Florian, 02.10., Prinzip wie haru): immer sichtbar beim Rundflug, weißer Kreis mit dunklem
     Punkt; direkt auf dem Punkt größer mit Lupe, darüber ein Etikett, beides in der Farbe des Ladens (Florian, Runde 33;
     vorher Himmelblau). --m/--m-auf setzt das Skript je Laden (FARBEN). Verdeckte Marker blenden aus. */
  #marker { position: fixed; inset: 0; pointer-events: none; z-index: 1; transition: opacity .3s; }
  #marker.aus { opacity: 0; }
  #marker.aus .marker { pointer-events: none; }
  /* will-change (Runde 44, Florian: Etikett-Text sprang beim Drehen auf und ab): jeder Marker ist eine eigene Ebene
     und gleitet samt Schrift als Ganzes; sonst rastet nur die Schrift auf ganze Pixel ein (Runden auf ganze Pixel
     ließ dagegen alle Marker zucken) */
  .marker { --m: #2d2b45; --m-auf: #fff; position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0;
    border: 0; background: none; pointer-events: auto; cursor: pointer; transition: opacity .25s;
    will-change: transform; }
  .marker.weg { opacity: 0; pointer-events: none; }
  .marker .kreis { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%;
    background: #fff; color: var(--m-auf); box-shadow: 0 3px 10px rgba(45, 43, 69, .28); display: grid;
    place-items: center; transition: transform .2s, background-color .2s; }
  .marker .kern { width: 11px; height: 11px; border-radius: 50%; background: #2d2b45; transition: opacity .2s; }
  .marker .lupe { position: absolute; width: 16px; height: 16px; opacity: 0; transition: opacity .2s; }
  .marker .etikett { position: absolute; left: 0; bottom: 30px; transform: translate(-50%, 6px); white-space: nowrap;
    background: var(--m); color: var(--m-auf); padding: 7px 14px; border-radius: 999px;
    font: 700 14px/1 'Hanken Grotesk', system-ui, sans-serif; box-shadow: 0 4px 12px rgba(45, 43, 69, .2); opacity: 0;
    transition: opacity .2s, transform .2s; pointer-events: none; }
  .marker.an .kreis { transform: scale(1.55); background: var(--m); }
  .marker.an .kern { opacity: 0; }
  .marker.an .lupe { opacity: 1; }
  .marker.an .etikett { opacity: 1; transform: translate(-50%, -4px); }
  /* Standbild ohne WebGL (Runde 43): Blender-Bild der Startansicht, so groß wie es in den freien Teil rechts von Liste
     bzw. Karte passt (Handy: über der Leiste); --seite = Breite / Höhe setzt das Skript. Die Marker sitzen in Prozent
     des Bildes. Nach einem Ladefehler unten rechts „3D neu laden“. */
  #standbild { --kb: clamp(420px, calc(min(100vh - 112px, 980px) * 9 / 16), 560px); position: fixed; inset: 0;
    box-sizing: border-box; display: grid; place-items: center; transition: padding .4s;
    padding: 32px 40px 32px calc(2 * var(--rand) + var(--lb)); }
  body.karte-offen #standbild { padding-left: calc(2 * var(--rand) + var(--kb)); }
  #standbild[hidden] { display: none; }
  #standbild .rahmen { position: relative; aspect-ratio: var(--seite, 1.25);
    width: min(100%, calc((100vh - 64px) * var(--seite, 1.25))); }
  #standbild img { display: block; width: 100%; height: 100%; }
  body.standbild #hud { display: none; }
  #neu3d { position: fixed; right: 24px; bottom: 24px; z-index: 1; padding: 12px 22px; border: 0; border-radius: 999px;
    background: var(--tinte); color: #fff; font: 800 15px/1 'Hanken Grotesk', system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 5px 14px rgba(45, 43, 69, .25); }
  #neu3d[hidden] { display: none; }
  #neu3d:disabled { cursor: progress; }
  #neu3d .punkte { display: inline-flex; gap: 4px; margin-right: 9px; vertical-align: 2px; }
  #neu3d .punkte i { width: 6px; height: 6px; border-radius: 50%; background: #fff;
    animation: huepfen 1s ease-in-out infinite; }
  #neu3d .punkte i:nth-child(2) { animation-delay: .12s; }
  #neu3d .punkte i:nth-child(3) { animation-delay: .24s; }
  @keyframes huepfen { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-4px); } }
  body.karte-offen #neu3d { opacity: 0; pointer-events: none; }
  /* Links die Bedienung, rechts die Szene (Florian, Runden 31/33): in der Übersicht die Stationsliste, im Laden die
     Infokarte an derselben Stelle (beide 40 px vom Rand); das Bild rückt dafür nach rechts (setzePlatz im Skript).
     --grund: Warmweiß für die Liste (Florian, Runde 33: reines Weiß passt nicht zur Szene). */
  :root { --rand: 40px; --lb: 340px; --tinte: #2d2b45; --grund: #fff9f2; }
  /* Infokarte im Laden (Florians Mockup, Runde 30; seit Runde 33 als Seitenkarte links, seit Runde 34 hochkant etwa
     9 : 16 mit Abstand oben und unten): oben Ort, Sprache und ✕, dann Kicker, Name, Untertitel, Text, Merkmale, Zeilen,
     Hauptknopf; unten weitere Stationen. Das große Blender-Bild nur auf dem Handy, am Rechner steht der echte Laden
     daneben. Farben je Laden (Florian, Runde 33): k = Hauptknopf, auf = Schrift darauf, text = Kicker und Symbole
     (mind. 4,5 : 1), hell/hell2 = Tönung, flaeche = Warmweiß mit einem Hauch Ladenfarbe; setzt setzeKartenfarbe. */
  #karte { --k: #2d2b45; --k-hover: #2d2b45; --k-auf: #fff; --k-text: #2d2b45; --k-hell: #f1ecef; --k-hell2: #e6dee3;
    --k-schatten: rgba(45, 43, 69, .2); --k-rand: #efe7e1; --k-leiste: #f6efe8; --k-flaeche: var(--grund);
    position: fixed; left: 0; top: 0; bottom: 0; padding: 56px var(--rand); display: flex; align-items: center;
    pointer-events: none; z-index: 2; }
  #karte .flaeche { --kh: min(calc(100vh - 112px), 980px); box-sizing: border-box; height: var(--kh);
    width: clamp(420px, calc(var(--kh) * 9 / 16), 560px); display: flex; flex-direction: column;
    gap: 14px; padding: 20px 22px 16px; background: var(--k-flaeche); border-radius: 32px;
    box-shadow: 0 24px 60px rgba(58, 42, 53, .22), 0 3px 10px rgba(58, 42, 53, .08);
    font: 16px/1.55 'Hanken Grotesk', system-ui, sans-serif; color: var(--tinte); opacity: 0;
    transform: translateX(-18px); transition: opacity .3s, transform .3s; }
  #karte.an .flaeche { opacity: 1; transform: none; pointer-events: auto; }
  #hud { transition: opacity .3s; }
  body.karte-offen #hud { opacity: 0; pointer-events: none; }
  .sym { width: 1em; height: 1em; flex: none; }
  #karte .bild { display: none; position: relative; flex: none; aspect-ratio: 16 / 10; border-radius: 20px;
    overflow: hidden; background: #f4dbe5; }
  #karte .bild img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Nur der Inhalt scrollt (auf niedrigen Bildschirmen); Hauptknopf und Stationen bleiben immer unten sichtbar (Runde
     34). Ist unten noch mehr, blendet der Inhalt dort weich aus (.mehr, setzt das Skript). Rechts Platz für den
     schmalen Scrollbalken. */
  #karte .inhalt { flex: 1; min-height: 0; overflow: auto; padding: 2px 8px 2px 2px; margin: 0 -8px 0 -2px;
    display: flex; flex-direction: column; scrollbar-width: thin; }
  #karte .inhalt.mehr { mask-image: linear-gradient(#000 calc(100% - 48px), transparent);
    -webkit-mask-image: linear-gradient(#000 calc(100% - 48px), transparent); }
  #karte .kopfzeile { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  #karte .ort { margin-right: auto; display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px 9px 12px;
    border-radius: 999px; background: var(--k-hell); color: var(--k-text); font-weight: 700; font-size: 15px;
    line-height: 1; }
  #karte .kicker, #karte .unter, #karte .abschnitt h3, #karte .leiste .titel, #tour .titel {
    font-weight: 800; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--k-text); }
  #karte .sprache { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--k-hell); }
  #karte .sprache button { font: 700 12px/1 'Hanken Grotesk', system-ui, sans-serif; color: var(--k-text);
    background: none; border: 0; padding: 7px 10px; border-radius: 999px; cursor: pointer; opacity: .7; }
  #karte .sprache button.an { background: #fff; opacity: 1; box-shadow: 0 1px 3px rgba(45, 43, 69, .15); }
  #karte .rund { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--k-hell);
    color: var(--k-text); cursor: pointer; display: grid; place-items: center; font-size: 20px; padding: 0; }
  #karte .rund:hover, #karte .sprache button:hover, #karte .zeile.link:hover { background: var(--k-hell2); }
  #karte h2 { margin: 6px 0 4px; font: 800 44px/1.04 'Hanken Grotesk', system-ui, sans-serif; letter-spacing: -.02em; }
  #karte .unter { margin-bottom: 16px; }
  #karte p { margin: 0 0 18px; }
  #karte .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px;
    margin-bottom: 20px; }
  #karte .chip { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px;
    border-radius: 18px;
    border: 1.5px solid var(--k-rand); background: rgba(255, 255, 255, .55); }
  #karte .chip .kreis { width: 34px; height: 34px; border-radius: 50%; background: var(--k-hell);
    color: var(--k-text); display: grid; place-items: center; font-size: 17px; flex: none; }
  /* Merkmale: Symbol oben, Text darunter über die ganze Breite (Runde 36: lange Wörter wie „Apprenticeship“ passten
     neben dem Symbol nicht in die schmalen Kacheln) */
  #karte .chip > span:last-child { min-width: 0; max-width: 100%; overflow-wrap: break-word; }
  #karte .chip b { display: block; font-size: 14px; line-height: 1.2; }
  #karte .chip small { display: block; font-size: 12px; color: #8a7f8c; line-height: 1.3; }
  #karte .abschnitt { border-top: 1.5px solid var(--k-rand); padding-top: 16px; margin-bottom: 18px; }
  #karte .abschnitt h3 { margin: 0 0 10px; }
  #karte .zeile { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 18px;
    border: 1.5px solid var(--k-rand); background: rgba(255, 255, 255, .55); margin-bottom: 8px;
    text-decoration: none; color: inherit; font-size: 15px; }
  #karte .zeile .sym { color: var(--k-text); font-size: 19px; }
  #karte .zeile .wert { margin-left: auto; color: #6f6878; text-align: right; }
  #karte .zeile .pfeil { color: var(--k-text); font-size: 17px; margin-left: 4px; }
  /* Hauptknopf: weiße Schrift auf der Ladenfarbe (Florian, Runde 34). 19 px fett zählt als große Schrift, dafür
     reichen 3 : 1; die Farben in FARBEN sind nur so weit nachgedunkelt. */
  #karte .los { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none; color: var(--k-auf); background: var(--k); padding: 14px 22px; border-radius: 999px;
    font-weight: 800; font-size: 19px; line-height: 1.2; box-shadow: 0 5px 12px var(--k-schatten); }
  #karte .los:hover { background: var(--k-hover); }
  #karte .los.leer { background: #f0eaed; color: #8a7f8c; box-shadow: none; pointer-events: none; }
  #karte .los .sym { font-size: 21px; }
  #karte [hidden] { display: none !important; }      /* sonst gewinnt display: flex/grid (Wohnung ohne Hauptknopf) */
  /* Weitere Stationen (Florian, Runde 34): drei Bilder im Kreis, die aktuelle Station in der Mitte und etwas größer,
     links und rechts die Nachbarn; Pfeile oder Klick auf ein Nachbarbild fliegen weiter. Rahmen in der Ladenfarbe (--s
     setzt das Skript). */
  #karte .leiste { flex: none; padding: 10px 10px 12px; border-radius: 22px; background: var(--k-leiste); }
  #karte .leiste .titel { display: flex; align-items: center; gap: 7px; padding: 0 4px 10px; line-height: 1.2; }
  #karte .leiste .titel .sym { font-size: 15px; }
  #karte .leiste .titel .zahl { margin-left: auto; letter-spacing: .04em; color: #8a7f8c; }
  #karte .karussell { display: grid; align-items: center; gap: 8px;
    grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr) auto; }
  #karte .weiter { width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; background: #fff;
    color: var(--k-text); display: grid; place-items: center; font-size: 19px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(45, 43, 69, .12); }
  #karte .weiter:hover { background: var(--k-hell); }
  .station { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; color: var(--tinte);
    font: 700 14px/1.2 'Hanken Grotesk', system-ui, sans-serif; }
  .station img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  #karte .station { min-width: 0; padding: 4px; border: 2.5px solid transparent; border-radius: 15px; background: #fff;
    box-shadow: 0 2px 5px rgba(45, 43, 69, .1); transition: border-color .2s, transform .2s; }
  #karte .station img { border-radius: 10px; }
  #karte .station > span { display: flex; align-items: center; justify-content: center; height: 2.5em;
    padding: 2px 2px 0; font-size: 12px; line-height: 1.2; text-align: center; overflow: hidden; }
  #karte .station small { display: none; }
  #karte .station:hover { border-color: var(--s); transform: translateY(-2px); }
  #karte .station.an { border-color: var(--s); cursor: default; transform: none; }
  /* Stationsliste in der Übersicht (Florian, Runden 31/33/34): links und untereinander, je Zeile Bild, Ort und Tool,
     seit Runde 34 größer (Bilder kommen besser zur Geltung); Zeigen schaltet den Marker des Ladens ein (das Diorama
     dreht seit Runde 44 dabei weiter), die Zeile tönt sich in der Ladenfarbe */
  #tour { box-sizing: border-box; position: fixed; left: var(--rand); top: 50%; transform: translateY(-50%);
    width: var(--lb); max-height: calc(100% - 140px); display: flex; flex-direction: column; padding: 18px 10px 10px;
    border-radius: 30px; background: var(--grund); box-shadow: 0 14px 40px rgba(58, 42, 53, .18); z-index: 1;
    transition: opacity .3s, transform .3s; }
  #tour.aus { opacity: 0; transform: translate(-18px, -50%); pointer-events: none; }
  #tour .titel { display: flex; align-items: center; gap: 7px; padding: 0 12px 12px; color: #8a7f8c; }
  #tour .titel .sym { font-size: 15px; }
  #tour .stationen { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0;
    scrollbar-width: none; }
  #tour .stationen::-webkit-scrollbar { display: none; }
  #tour .station { display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: center; gap: 14px;
    padding: 7px; border-radius: 18px; transition: background-color .2s; }
  #tour .station img { border-radius: 12px; box-shadow: 0 1px 4px rgba(45, 43, 69, .14); }
  #tour .station > span { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #tour .station .name { font-size: 16px; }
  #tour .station small { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--s-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tour .station:hover, #tour .station:focus-visible { background: var(--s-hell); }
  /* Einschwingen (Runde 39; Prinzip wie haru, eigene Werte): Stationsliste und Karte kommen leicht gedreht von links
     oben und pendeln sich mit kleinem Nachwackeln ein; beim ersten Mal deutlich, danach leicht (.leicht). Über die
     eigenen Eigenschaften translate/rotate, so bleiben die transform-Werte der Elemente unberührt. */
  .schwingt { animation: schwingen .95s cubic-bezier(.3, .7, .4, 1); transform-origin: 40px 0; }
  .schwingt.leicht { animation-name: schwingen-leicht; animation-duration: .7s; }
  @keyframes schwingen {
    0% { opacity: 0; translate: -36px -48px; rotate: -11deg; }
    45% { opacity: 1; translate: 0 0; rotate: 2.6deg; }
    66% { rotate: -1.3deg; }
    84% { rotate: .5deg; }
    100% { opacity: 1; translate: 0 0; rotate: 0deg; }
  }
  @keyframes schwingen-leicht {
    0% { opacity: 0; translate: -16px 0; rotate: -2.5deg; }
    55% { opacity: 1; translate: 0 0; rotate: .8deg; }
    80% { rotate: -.3deg; }
    100% { opacity: 1; translate: 0 0; rotate: 0deg; }
  }
  /* Unterseite als Karte (Runde 62, Florians Idee): eine Fläche legt sich ganz über die Gasse (Farbe je Unterseite =
     deren Boden, --seite-grund, sonst wirkte der Spalt anders getönt), die Unterseite rutscht als Karte von unten darauf
     und liegt fast bis oben. Runde 63: richtige Karte mit warmweißem Rand rundum (links, rechts, oben), oben runde
     Ecken, unten läuft sie über den Rand; die Oberkante steigt nach rechts ab (wie leicht schräg gelegt). Form und
     Schatten zeichnet ein SVG (setzt das Skript, siehe form()); der Inhalt ist nicht gedreht (bliebe sonst unscharf),
     nur so beschnitten. ✕ Home lässt die Karte fallen. */
  #seite { --seite-grund: var(--hg); position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #seite[hidden] { display: none; }
  #seite.vorgeladen { visibility: hidden; }   /* Runde 93: Unterseite vorgeladen, unsichtbar, aber schon ausgelegt */
  #seite .hg { position: absolute; inset: 0; background: var(--seite-grund); opacity: 0; transition: opacity .3s; }
  #seite.offen .hg { opacity: 1; pointer-events: auto; }
  #seite.sofort .hg { transition: none; }
  #seite .blatt { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% + 160px);
    transform-origin: 0 100%; }
  #seite .form { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #seite .form .schatten { fill: rgba(107, 51, 49, .2); }
  #seite .form .papier { fill: var(--grund); pointer-events: auto; }
  #seite .form .innen { fill: var(--seite-grund); }   /* Fläche innerhalb des Rands, wo der Inhalt nicht hinreicht */
  #seite iframe { position: absolute; border: 0; display: block; background: var(--seite-grund); pointer-events: auto; }
  /* Impressum und Datenschutz (Livegang F, Runde 98, Florians Wahl): klein unten rechts, am Handy mittig unter der
     Stationsleiste; öffnen als Karte wie die Unterseiten */
  #recht { position: fixed; right: 16px; bottom: 12px; z-index: 1; display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px; background: rgba(255, 249, 242, .75); color: #8a7f8c;
    font: 600 12px/1.2 'Hanken Grotesk', system-ui, sans-serif; }
  #recht a { color: #6e5a66; text-decoration: none; }
  #recht a:hover, #recht a:focus-visible { text-decoration: underline; }
  /* Sprache oben rechts (Livegang F, Florian: vorher nur in den Ladenkarten): wie auf den Unterseiten, schaltet alles */
  #sprachwahl { position: fixed; top: 16px; right: 16px; z-index: 1; display: inline-flex; padding: 4px;
    border-radius: 999px; background: rgba(255, 249, 242, .92); box-shadow: 0 3px 12px rgba(45, 43, 69, .12); }
  #sprachwahl button { border: 0; background: none; font: 700 14px/1 'Hanken Grotesk', system-ui, sans-serif;
    color: var(--tinte); padding: 8px 12px; border-radius: 999px; cursor: pointer; opacity: .65; }
  #sprachwahl button[aria-pressed="true"] { background: #fff; opacity: 1; box-shadow: 0 1px 3px rgba(45, 43, 69, .15); }
  @media (prefers-reduced-motion: reduce) {
    .schwingt { animation: none; }
    #karte .flaeche, #marker, .marker, .marker *, #tour, .station, #standbild { transition: none; }
    #laden .punkte i, #neu3d .punkte i { animation: none !important; }
  }
  @media (min-width: 761px) and (max-height: 1100px) {    /* bis 1080 p (auch Florians 21 : 9): etwas dichter */
    #karte .flaeche { gap: 12px; padding: 18px 20px 14px; }
    #karte .kopfzeile { margin-bottom: 14px; }
    #karte h2 { font-size: 38px; }
    #karte .unter { margin-bottom: 12px; }
    #karte p { margin-bottom: 14px; font-size: 15px; }
    #karte .chips { gap: 8px; margin-bottom: 14px; }
    #karte .chip { padding: 10px; gap: 6px; }
    #karte .chip .kreis { width: 30px; height: 30px; font-size: 15px; }
    #karte .abschnitt { padding-top: 12px; margin-bottom: 6px; }
    #karte .zeile { padding: 8px 14px; margin-bottom: 6px; }
    #karte .los { padding: 12px 20px; }
  }
  @media (max-width: 760px) {                             /* Handy: Karte als Blatt über die ganze Höhe, Bild oben */
    #karte { right: 0; padding: 10px; }
    #karte .flaeche { height: 100%; width: 100%; overflow: auto; padding: 12px; gap: 12px; border-radius: 26px;
      transform: translateY(14px); }
    #karte .bild { display: block; }
    #karte .inhalt { flex: none; overflow: visible; padding: 0; margin: 0; }
    #karte h2 { font-size: 34px; }
    #karte .karussell { gap: 6px; }
    #karte .weiter { width: 32px; height: 32px; }
    #tour { left: 10px; right: 10px; top: auto; bottom: 10px; width: auto; max-height: none; transform: none;
      padding: 8px; border-radius: 22px; }
    #tour.aus { transform: translateY(16px); }
    #tour .titel { display: none; }
    #tour .stationen { flex-direction: row; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; }
    #tour .station { flex: none; width: 112px; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 4px;
      scroll-snap-align: start; }
    #tour .station small { display: none; }
    #tour .station .name { font-size: 13px; padding: 0 2px; }
    #standbild, body.karte-offen #standbild { padding: 16px 10px 170px; overflow: hidden; }   /* Handy: größer, */
    #standbild .rahmen { width: min(150%, calc((100vh - 186px) * var(--seite, 1.25))); }   /* die Gleise außen fehlen */
    #neu3d { left: 10px; right: auto; top: 10px; bottom: auto; }
    #tour { bottom: 34px; }                              /* darunter Impressum und Datenschutz */
    #recht { right: 50%; translate: 50% 0; bottom: 6px; background: none; }

<body>
<div id="seite" role="dialog" aria-modal="true" hidden>
  <div class="hg"></div>
  <div class="blatt">
    <svg class="form" aria-hidden="true"><defs><filter id="seite-weich" x="-10%" y="-10%" width="120%"
      height="120%"><feGaussianBlur stdDeviation="10" /></filter></defs>
      <path class="schatten" filter="url(#seite-weich)" transform="translate(0 4)" /><path class="papier" /><path class="innen" /></svg>
  </div>
</div>
<script>
// Unterseiten als Karte über der Gasse (Runde 62). Gleiche Seite, eigene Adresse (?seite=…, später /null/meter): Die
// Gasse bleibt geladen und wird nicht gezeichnet, solange die Fläche sie verdeckt (SEITE.verdeckt, liest die
// Schleife); zurück geht es ohne Ladebildschirm. Die Unterseite läuft als eigenes Dokument in der Karte (iframe mit
// ?eingebettet) und meldet sich per postMessage: bereit, schliessen (✕ Home oder Esc), sprache. Wer die Adresse direkt
// aufruft, sieht sofort die Karte; die Gasse lädt erst danach (SEITE.direkt) und baut sich auf, wenn man sie schließt.
// Unter dem direkten Einstieg liegt ein Eintrag ohne ?seite, so führt auch „Zurück“ im Browser in die Gasse.
(() => {
  // grund: Boden der Unterseite am oberen Rand (gemessen), Farbe der Fläche dahinter
  const SEITEN = { 'null-meter': { datei: 'null-meter-reise.html', titel: 'HamMeter · Florian Kierski', grund: '#FFC691' },
                   'wispui': { datei: 'wispui.html', titel: 'WispUI · Florian Kierski', grund: '#CDE9F1' },   // Runde 73: Schaufenster
                   'atelier': { datei: 'atelier.html', titel: 'About · Florian Kierski', grund: '#FFC8A4' },   // Runde 79
                   'impressum': { datei: 'impressum.html', titel: 'Impressum · Florian Kierski', grund: '#FFC8A4' },
                   'datenschutz': { datei: 'datenschutz.html', titel: 'Datenschutz · Florian Kierski',
                                    grund: '#FFC8A4' },   // Livegang F: Impressum und Datenschutz
                   'devlog': { datei: 'devlog.html', titel: 'Devlog · Florian Kierski', grund: '#D2EBE4' } };   // Livegang G
  const el = document.getElementById('seite'), blatt = el.querySelector('.blatt');
  const ruhig = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const titelGasse = document.title;
  let frame = null, laeufe = [], uhr = 0, meldeBereit = null, warm = null;
  let gelandet = true, gefragt = false;                     // Runde 93: Karte fertig hochgeflogen (karte.js, gelandet())
  const S = window.SEITE = { offen: null, verdeckt: false, beiSprache: null, direkt: Promise.resolve() };
  S.adresse = slug => {
    const u = new URL(location.href);
    if (slug) u.searchParams.set('seite', slug); else u.searchParams.delete('seite');
    return u.pathname + u.search + u.hash;
  };
  const sprache = () => { try { return localStorage.getItem('nullAlleySprache') || 'en'; } catch (e) { return 'en'; } };
  const sende = (typ, wert) => { if (frame && frame.contentWindow) frame.contentWindow.postMessage({ nullAlley: true, typ, wert }, location.origin); };
  const stopp = () => { laeufe.forEach(a => a.cancel()); laeufe = []; };

  // Form der Karte (Runden 63–66): links und rechts über den Bildrand hinaus (m < 0, Ecken samt Rand außerhalb; die
  // runden Ecken sieht man nur beim Hochfliegen), oben links spalt, nach rechts steig tiefer, warmweißer Rand rand,
  // oben runde Ecken (Radius r), unten weit über den Bildrand. Papier und Schatten als SVG-Pfad, der Inhalt mit
  // demselben Umriss, um den Rand kleiner (clip-path). Verglichen mit Rand rundum (m 14 px, Handy 8 px): Florian
  // wählte „bis zum Rand“ (Runde 66).
  const pfad = (x0, y0, x1, s, r, u) => {
    const y1 = y0 + s * (x1 - x0), k = 0.4477, f = n => +n.toFixed(2);   // k = 1 − 0,5523 (Viertelkreis als Bézier)
    return `M${f(x0)} ${f(u)}L${f(x0)} ${f(y0 + r)}C${f(x0)} ${f(y0 + r * k)} ${f(x0 + r * k)} ${f(y0 + s * r * k)} ` +
      `${f(x0 + r)} ${f(y0 + s * r)}L${f(x1 - r)} ${f(y1 - s * r)}C${f(x1 - r * k)} ${f(y1 - s * r * k)} ${f(x1)} ` +
      `${f(y1 + r * k)} ${f(x1)} ${f(y1 + r)}L${f(x1)} ${f(u)}Z`;
  };
  function form() {
    const handy = innerWidth <= 760;
    const spalt = handy ? 10 : 12, steig = handy ? 6 : 20, rand = handy ? 6 : 8, r = handy ? 22 : 28;
    const m = -(r + rand + 4);
    const W = innerWidth, H = innerHeight, x0 = m, x1 = W - m, s = steig / (x1 - x0);
    const papier = pfad(x0, spalt, x1, s, r, H + 160);
    el.querySelector('.schatten').setAttribute('d', papier);
    el.querySelector('.papier').setAttribute('d', papier);
    // Inhalt: derselbe Umriss um den Rand kleiner; der Kasten des iframe nur so breit wie sichtbar (sonst meinte die
    // Unterseite, sie sei breiter als der Bildschirm). Wo er nicht hinreicht (links und rechts außerhalb,
    // unten beim Überschwingen), liegt die Fläche .innen in der Bodenfarbe, sonst wäre dort alles Papier (Runde 65,
    // Florian: der Rand links war beim Hochfliegen viel dicker als oben).
    const xi0 = x0 + rand, xi1 = x1 - rand, yi0 = spalt + rand + s * rand;
    el.querySelector('.innen').setAttribute('d', pfad(xi0, yi0, xi1, s, r - rand, H + 160));
    const li = Math.max(0, xi0), ri = Math.min(W, xi1), oben = yi0 + s * (li - xi0), wi = ri - li, hi = H - oben;
    if (frame) Object.assign(frame.style, { left: `${li}px`, top: `${oben}px`, width: `${wi}px`, height: `${hi}px`,
      clipPath: `path('${pfad(xi0 - li, yi0 - oben, xi1 - li, s, r - rand, hi + 1)}')` });
    return { m, spalt };
  }
  addEventListener('resize', () => { if (!el.hidden) form(); });

  // Hochfliegen wie in der Skizze (Florian, Runde 63: vorher zu schnell und steif): Lage mit leichtem Überschwingen
  // (backOut), die Neigung legt sich etwas langsamer und unabhängig davon, gedreht um die Ecke unten links
  const backOut = x => { const k = 0.9; return 1 + (k + 1) * (x - 1) ** 3 + k * (x - 1) ** 2; };
  const kurve = f => `linear(${Array.from({ length: 41 }, (_, i) => +f(i / 40).toFixed(4)).join(', ')})`;
  const HOCH = CSS.supports('animation-timing-function', 'linear(0, 1)') ? kurve(backOut) : 'cubic-bezier(.3, 1.2, .5, 1)';

  // halt: die Reise gleich an diesem Halt öffnen (Runde 70, Verweis von WispUI auf HamMeter installieren)
  function blattFuer(slug, halt) {
    if (frame && frame.dataset.seite === slug && !halt) { sende('sprache', sprache()); sende('weiter'); return; }
    if (frame) frame.remove();
    gefragt = false;
    frame = document.createElement('iframe');
    frame.dataset.seite = slug;
    frame.title = SEITEN[slug].titel;
    frame.src = `${SEITEN[slug].datei}?eingebettet${halt ? `&halt=${encodeURIComponent(halt)}` : ''}`;
    blatt.append(frame);
  }
  function oeffne(slug, { push = true, sofort = false, halt = null } = {}) {
    if (!SEITEN[slug] || S.offen === slug) return;
    if (push) history.pushState({ seite: slug }, '', S.adresse(slug));
    performance.mark('seite:oeffne');
    S.offen = slug;
    document.title = SEITEN[slug].titel;
    el.setAttribute('aria-label', SEITEN[slug].titel);
    el.style.setProperty('--seite-grund', SEITEN[slug].grund);
    blattFuer(slug, halt);
    clearTimeout(uhr);
    stopp();
    entwischt();
    el.classList.remove('vorgeladen');
    el.hidden = false;
    form();
    el.classList.toggle('sofort', sofort);
    void el.offsetWidth;                                    // Übergang der Fläche von 0 an
    el.classList.add('offen');
    gelandet = sofort || ruhig;
    if (sofort) S.verdeckt = true;
    else {
      uhr = setTimeout(() => { S.verdeckt = true; }, 320);  // Fläche deckt: Gasse nicht mehr zeichnen
      if (ruhig) laeufe = [blatt.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: 'ease-out' })];
      else {
        blatt.style.transformOrigin = '0 100%';
        laeufe = [
          blatt.animate([{ translate: `0 ${innerHeight + 200}px` }, { translate: '0 0' }], { duration: 1000, easing: HOCH }),
          blatt.animate([{ rotate: '4deg' }, { rotate: '0deg' }], { duration: 1150, easing: 'cubic-bezier(.45, 0, .3, 1)' }),
        ];
        Promise.all(laeufe.map(a => a.finished)).then(() => {   // gelandet: die Unterseite darf Teures vorbereiten
          if (S.offen !== slug) return;
          gelandet = true;
          if (gefragt) sende('gelandet');
        }, () => { /* abgebrochen */ });
      }
    }
    setTimeout(() => { if (S.offen === slug && frame) frame.focus(); }, sofort ? 0 : 300);
  }
  function schliesse({ vonHistory = false } = {}) {
    if (!S.offen) return;
    if (!vonHistory && history.state && history.state.seite) { history.back(); return; }   // popstate schließt
    if (!vonHistory) history.replaceState(null, '', S.adresse(null));
    S.offen = null;
    S.verdeckt = false;                                      // Gasse zeichnet wieder, noch unter der Fläche
    let gemerkt = null;                                      // Livegang F (Florian: Liste blieb Englisch, nachdem er
    try { gemerkt = localStorage.getItem('nullAlleySprache'); } catch (e) { /* ohne Speicher */ }   // in der Karte
    if (gemerkt && S.beiSprache) S.beiSprache(gemerkt);      // umgestellt hatte): Sprache der Karte übernehmen
    if (meldeBereit) meldeBereit();                          // direkt eingestiegen: Gasse jetzt laden (Runde 92)
    document.title = titelGasse;
    clearTimeout(uhr);
    stopp();
    el.classList.remove('sofort');
    if (frame) frame.blur();
    const fertig = () => { if (S.offen) return; el.hidden = true; stopp(); entwischt(); sende('pause'); };
    if (ruhig) {
      laeufe = [blatt.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' })];
      el.classList.remove('offen');
      uhr = setTimeout(fertig, 320);
      return;
    }
    // kurz anheben, dann fallen (beschleunigt) und dabei nach rechts kippen, gedreht um die Ecke oben links (Florian:
    // „das Runterfallen passt“); die Fläche geht mit, wenn die Karte halb weg ist. Weggewischt (Runde 102) fällt sie
    // ohne Anheben von dort, wo der Finger sie losgelassen hat (translate und rotate bleiben stehen und addieren sich).
    const { m, spalt } = form();
    blatt.style.transformOrigin = `${m}px ${spalt}px`;
    laeufe = [blatt.animate(gewischt ? [
      { transform: 'none', easing: 'cubic-bezier(.45, 0, .85, .4)' },
      { transform: 'translateY(calc(100% + 80px)) rotate(5deg)' },
    ] : [
      { transform: 'none', easing: 'cubic-bezier(.3, 0, .5, 1)' },
      { transform: 'translateY(-10px) rotate(-.4deg)', offset: .16, easing: 'cubic-bezier(.55, 0, .85, .35)' },
      { transform: 'translateY(calc(100% + 80px)) rotate(7deg)' },
    ], { duration: gewischt ? 600 : 760, fill: 'forwards' })];
    uhr = setTimeout(() => { el.classList.remove('offen'); uhr = setTimeout(fertig, 330); }, 420);
  }
  S.oeffne = slug => oeffne(slug);
  // Runde 102 (Florian am Handy: zurück per Wischen von links nach rechts): Die Unterseite meldet die Geste (karte.js,
  // wisch mit dx). Die Karte folgt dem Finger und kippt dabei leicht um die Ecke oben links; losgelassen fällt sie wie
  // bei ✕ Home (ab einem Drittel der Breite oder mit Schwung), sonst federt sie zurück.
  let gewischt = false;
  const kipp = dx => `${Math.min(6, dx / innerWidth * 8)}deg`;
  function entwischt() { gewischt = false; blatt.style.translate = blatt.style.rotate = ''; }
  function wisch({ dx, v = 0, los = false }) {
    if (!S.offen || !gelandet) return;
    if (!los) {
      if (!gewischt) { const { m, spalt } = form(); blatt.style.transformOrigin = `${m}px ${spalt}px`; }
      gewischt = true;
      blatt.style.translate = `${dx}px 0`;
      blatt.style.rotate = kipp(dx);
      return;
    }
    if (!gewischt) return;
    if (dx > innerWidth / 3 || (v > 0.5 && dx > 60)) { schliesse(); return; }
    entwischt();
    blatt.animate([{ translate: `${dx}px 0`, rotate: kipp(dx) }, { translate: '0 0', rotate: '0deg' }],
                  { duration: ruhig ? 0 : 280, easing: 'cubic-bezier(.2, .8, .3, 1)' });
  }
  // Runde 93 (Florian: nach der Landung dauerte es zu lange, bis der Raum kam): Liegt die Karte eines Ladens mit
  // Unterseite offen, lädt die Unterseite schon verdeckt und bereitet sich vor (gilt als gelandet), dann wartet sie
  // pausiert vor ihrem ersten Bild. Ein Klick zeigt sie sofort: Die Karte fliegt ohne Last, der Raum baut sich auf.
  S.vorladen = slug => {
    if (S.offen || !SEITEN[slug] || (frame && frame.dataset.seite === slug)) return false;
    gelandet = true;
    blattFuer(slug);
    el.classList.add('vorgeladen');
    el.hidden = false;                                       // ausgelegt (sonst kostet das erste Bild nach dem Klick)
    form();
    return true;
  };
  // Runde 94 (Florian: beim Öffnen einer Unterseite ruckelt es ab und zu): Noch im Ladebildschirm lädt jede Unterseite
  // einmal verdeckt und bereitet sich bis zu ihrem ersten Bild vor, dann wird sie wieder geschlossen. Danach liegen ihre
  // Dateien im Speicher des Browsers und ihre Shader übersetzt im Speicher der Grafik; beim echten Öffnen fällt diese
  // Arbeit weg. Nur am Rechner (am Handy kosten die Dateien Datenvolumen), schritt(n) nach jeder Seite.
  S.aufwaermen = async schritt => {
    const liste = ['atelier', 'wispui', 'null-meter', 'devlog'], ende = performance.now() + 15000;
    for (const [i, slug] of liste.entries()) {
      if (!S.vorladen(slug)) return;
      await new Promise(r => { warm = r; setTimeout(r, Math.max(0, Math.min(6000, ende - performance.now()))); });
      warm = null;
      schritt(i + 1, liste.length);
    }
    if (S.offen || !frame) return;
    frame.remove();
    frame = null;
    el.classList.remove('vorgeladen');
    el.hidden = true;
  };
  S.schliesse = () => schliesse();
  addEventListener('popstate', e => {
    const slug = e.state && e.state.seite;
    if (slug) oeffne(slug, { push: false });
    else schliesse({ vonHistory: true });
  });
  addEventListener('message', e => {
    const d = e.data;
    if (e.origin !== location.origin || !frame || e.source !== frame.contentWindow || !d || !d.nullAlley) return;
    if (d.typ === 'bereit') {
      performance.mark('seite:bereit');
      if (meldeBereit) setTimeout(meldeBereit, 3000);       // spätestens 3 s nach ihrem ersten Bild (ohne „ruhig“)
      if (!S.offen) sende('pause');
      if (warm) warm();
    } else if (d.typ === 'ruhig') { if (meldeBereit) meldeBereit(); }   // Karte fertig aufgebaut (Runde 92)
    else if (d.typ === 'landung?') { if (gelandet) sende('gelandet'); else gefragt = true; }
    else if (d.typ === 'schliessen') schliesse();
    else if (d.typ === 'wisch' && d.wert) wisch(d.wert);
    else if (d.typ === 'seite' && d.wert && SEITEN[d.wert.seite]) oeffne(d.wert.seite, { halt: d.wert.halt });
    else if (d.typ === 'sprache') { try { localStorage.setItem('nullAlleySprache', d.wert); } catch (err) { /* egal */ }
                                    if (S.beiSprache) S.beiSprache(d.wert); }
  });
  const direkt = new URLSearchParams(location.search).get('seite');
  if (SEITEN[direkt]) {
    // Die Gasse lädt erst danach (Runde 92, Livegang C: sonst fiel ihr Auspacken mitten in den Aufbau der Karte): wenn
    // die Karte „ruhig“ meldet (fertig aufgebaut), spätestens 3 s nach ihrem ersten Bild, sofort beim Schließen, ganz
    // ohne Meldung nach 10 s
    S.direkt = new Promise(r => { meldeBereit = r; setTimeout(r, 10000); });
    S.direktEinstieg = true;                                 // dann kein Aufwärmen (Runde 94)
    const halt = new URLSearchParams(location.search).get('halt');   // Runde 75: von der Reise allein umgeleitet
    if (halt) { const u = new URL(location.href); u.searchParams.delete('halt'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
    history.replaceState(null, '', S.adresse(null));
    history.pushState({ seite: direkt }, '', S.adresse(direkt));
    oeffne(direkt, { push: false, sofort: true, halt });
  }
})();
</script>

    <div class="punkte" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="titel">Florian Kierski</div>
    <div class="rolle"></div>
    <div class="status"></div>
    <button class="nochmal" hidden></button>

  <div class="tipp"></div>

<script>
// Ladebildschirm (Runde 38): steht sofort, noch bevor Three.js vom CDN da ist. Das Modul meldet über window.LADEN
// Ladenfarben, Fortschritt (0–1), Fertig oder Fehler. Sprache wie die Karte (EN Standard, DE wenn gewählt).
(() => {
  let de = false;
  try { de = localStorage.getItem('nullAlleySprache') === 'de'; } catch (e) { /* ohne Speicher */ }
  const T = de
    ? { laedt: 'Die Gasse wird aufgebaut …', fast: 'Gleich geschafft …', nochmal: 'Neu laden',
        fehler: 'Die Gasse konnte nicht geladen werden.',
        tippBild: 'Punkt oder Station anklicken zum Besuchen',
        tipp: 'Ziehen zum Umsehen · Scrollen zum Zoomen · Punkt anklicken zum Besuchen',
        tippTouch: 'Wischen zum Umsehen · Zwei Finger zum Zoomen · Punkt antippen zum Besuchen',
        prozent: n => `${n} %`,
        rolle: 'UX/UI-Designer · Angehender Fachinformatiker' }
    : { laedt: 'Building the alley …', fast: 'Almost there …', nochmal: 'Reload',
        fehler: 'The alley couldn\'t be loaded.', tippBild: 'Click a dot or a stop to visit',
        tipp: 'Drag to look around · Scroll to zoom · Click a dot to visit',
        tippTouch: 'Swipe to look around · Pinch to zoom · Tap a dot to visit', prozent: n => `${n}%`,
        rolle: 'UX/UI designer · Aspiring IT specialist' };
  const el = document.getElementById('laden'), status = el.querySelector('.status');
  const punkte = [...el.querySelectorAll('.punkte i')];
  punkte.forEach((p, i) => { p.style.animationDelay = `${i * 0.12}s`; });
  const zusammen = s => s.split(' · ').map(t => t.replace(/ /g, '\u00a0')).join(' · ');   // Umbruch nur an „·“
  el.querySelector('.tipp').textContent = zusammen(matchMedia('(pointer: coarse)').matches ? T.tippTouch : T.tipp);
  status.textContent = T.laedt;
  el.querySelector('.rolle').textContent = zusammen(T.rolle);
  let webgl = false, gemeldet = false;
  try { const c = document.createElement('canvas'); webgl = !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch (e) { /* kein WebGL */ }
  function fehler(text, knopf) {
    clearInterval(uhr);
    el.classList.add('fehler');
    status.textContent = text;
    const b = el.querySelector('.nochmal');
    b.hidden = !knopf; b.textContent = T.nochmal; b.onclick = () => location.reload();
  }
  // Mindestens MIN ms (Florian, Runde 43): bei schnellem Laden blitzte er nur auf. Die Anzeige folgt dem echten
  // Fortschritt, aber höchstens so schnell, dass sie nach MIN ms voll ist; so füllen sich die Punkte nacheinander.
  const MIN = 1200, beginn = performance.now();
  let ziel = 0, gezeigt = -1, fast = false;
  function zeige() {
    if (el.classList.contains('fehler')) return;
    const f = Math.min(ziel, (performance.now() - beginn) / MIN);
    if (f === gezeigt) return;
    gezeigt = f;
    punkte.forEach((p, i) => p.classList.toggle('an', f >= (i + 1) / punkte.length - 1e-6));
    status.textContent = `${fast ? T.fast : T.laedt} ${T.prozent(Math.round(f * 100))}`;
  }
  const uhr = setInterval(zeige, 40);
  const L = window.LADEN = {
    webgl,
    farben(liste) { gemeldet = true; punkte.forEach((p, i) => p.style.setProperty('--f', liste[i])); },
    fortschritt(f, fast_) { el.classList.add('laeuft'); ziel = f; fast = !!fast_; zeige(); },
    bereit: () => new Promise(r => setTimeout(r, Math.max(0, MIN - (performance.now() - beginn)))),   // MIN vorbei
    fertig() {
      ziel = 1; fast = true; zeige(); clearInterval(uhr);
      el.classList.add('weg'); setTimeout(() => el.remove(), 900);
    },
    fehler: () => fehler(T.fehler, true),
    ohne3D() { el.querySelector('.tipp').textContent = T.tippBild; },   // Standbild (Runde 43)
  };
  setTimeout(() => { if (!gemeldet) fehler(T.fehler, true); }, 30000);   // Three.js vom CDN nicht erreichbar
})();

  const mat = alt.clone();                                  // wie das Teil (Laubraster der Krone), nur mit Stencil-Test
  Object.assign(mat.uniforms, GEMEINSAM);
  Object.assign(mat, { stencilWrite: true, stencilRef: 0, stencilFunc: THREE.NotEqualStencilFunc,
    stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.ZeroStencilOp, stencilZPass: THREE.ZeroStencilOp });
  const k = new THREE.Mesh(geo, mat);
  k.position.set(mi.x, -1e4, mi.z);
  k.renderOrder = 11 + 2 * i;
  m.add(zb, zf);
  scene.add(k);
  return { m, zb, zf, k };
}
function bauEinheiten() {
  const kam = kugel(START.ziel, START.az, START.el, START.dist), einheiten = [];
  const neu = (o, oben) => {
    const b = new THREE.Box3().setFromObject(o), mitte = b.getCenter(new V3());
    const anker = o.parent.worldToLocal(new V3(mitte.x, b.min.y, mitte.z));
    return { o, b, oben, anker, pos: o.position.clone(), sc: o.scale.clone(), sichtbar: o.visible,
             abstand: kam.distanceTo(new V3(mitte.x, 0, mitte.z)), delay: 0, dauer: 0.6, c: 1.7 };
  };
  const sammle = (o, oben) => {                             // Einheit = Teil, das nicht breiter als 20 m ist
    const s = new THREE.Box3().setFromObject(o).getSize(new V3());
    if (s.y < 0.2) return;                                  // Boden, Straßen, Gleise, Fundament: stehen schon
    if (Math.max(s.x, s.z) <= 20) einheiten.push(neu(o, oben));
    else if (o.children.length) o.children.forEach(c => sammle(c, oben));   // Bahnhof, Schilder, Fahrzeuge
    else einheiten.push(Object.assign(neu(o, oben), { breit: true }));
  };
  gltf.scene.children.forEach(o => sammle(o, o.name));
  const haeuser = einheiten.filter(u => !u.breit);
  for (const u of haeuser) {                                // Innenraum: liegt im Grundriss eines höheren Hauses
    u.haus = haeuser.find(h => h !== u && h.b.max.y > u.b.max.y + 0.5 && u.b.min.x > h.b.min.x - 0.3 &&
      u.b.max.x < h.b.max.x + 0.3 && u.b.min.z > h.b.min.z - 0.3 && u.b.max.z < h.b.max.z + 0.3);
  }
  const reihe = haeuser.filter(u => !u.haus).sort((a, b) => b.abstand - a.abstand);   // von hinten nach vorn
  const schritt = Math.min(0.09, 1.3 / reihe.length);
  reihe.forEach((u, i) => { u.delay = 0.15 + i * schritt + (u.oben === 'Schilder' ? 0.5 : 0); });
  haeuser.filter(u => u.haus).forEach(u => Object.assign(u, { delay: u.haus.delay + 0.2, dauer: 0.45 }));
  const gruppen = {};                                       // breite Teile: je Gruppe eine gemeinsame Schnitthöhe
  let nr = 0;
  for (const u of einheiten.filter(e => e.breit)) {
    const name = GRUPPE[u.oben] || u.oben, g = gruppen[name] ||= { schnitt: { value: 1e9 }, unten: 1e9, oben: -1e9 };
    g.unten = Math.min(g.unten, u.b.min.y); g.oben = Math.max(g.oben, u.b.max.y);
    const [delay, dauer] = BREIT[name] || [1, 0.7];
    Object.assign(u, { delay, dauer, gruppe: g, mats: [], helfer: [] });
    const meshes = [];                                      // erst sammeln: schnittHelfer hängt neue Meshes an
    u.o.traverse(m => { if (m.isMesh && m.material.isShaderMaterial) meshes.push(m); });
    meshes.forEach(m => {                                   // eigenes Material mit Schnitt, bis es steht
      const neu = m.material.clone();
      neu.defines = { ...neu.defines, SCHNITT: '' };
      Object.assign(neu.uniforms, GEMEINSAM, { uSchnitt: g.schnitt });
      u.mats.push([m, m.material]);
      if (!m.material.transparent) u.helfer.push(schnittHelfer(m, m.material, g, nr++));
      m.material = neu;
    });
  }
  return einheiten;
}
function setzeAufbau(u, k) {
  if (u.gruppe) {                                           // Lage für Lage (1/16 m), von unten nach oben
    const g = u.gruppe, h = g.unten + (g.oben - g.unten + 0.1) * (1 - Math.pow(1 - k, 2));
    u.o.visible = u.sichtbar && k > 0;
    g.schnitt.value = k >= 1 ? 1e9 : Math.floor(h * 16) / 16 + 0.001;
    for (const { k: f } of u.helfer) { f.position.y = g.schnitt.value; f.visible = u.o.visible; }
    if (k >= 1 && u.mats.length) {
      u.mats.forEach(([m, alt]) => { m.material.dispose(); m.material = alt; });
      u.helfer.forEach(({ m, zb, zf, k: f }) => {
        m.remove(zb, zf); scene.remove(f);
        [zb.material, zf.material, f.material, f.geometry].forEach(x => x.dispose());
      });
      u.mats = []; u.helfer = [];
    }
    return;
  }
  const s = k <= 0 ? 0 : backOut(k, u.c), f = Math.max(s, 0.001);   // ploppen aus dem Fußpunkt, bei k = 1 genau 1
  u.o.visible = u.sichtbar && s > 0.001;
  u.o.scale.copy(u.sc).multiplyScalar(f);
  u.o.position.copy(u.anker).lerp(u.pos, f);
}
// Schatten (Runde 42, Florian: keine harten Sprünge): Beim Aufbauen zeigt jede Einheit nur ihre eigenen Schatten.
// Zum Ende des Aufbaus legen sich die Schatten der Nachbarn weich darüber: ab SCHATTEN_AB s vor dem Ende,
// SCHATTEN_DAUER s lang mit sanftem Ein- und Auslauf, wie wenn eine dünne Wolke an der Sonne vorbeizieht.
const SCHATTEN_AB = 0.4, SCHATTEN_DAUER = 1.2;
let aufbau = null, bauHalt = null;                          // bauHalt: feste Zeit in s (nur zum Testen)
const neuerAufbau = einheiten => ({ t0: performance.now(), einheiten,
                                    ende: Math.max(...einheiten.map(u => u.delay + u.dauer)) });
function aufbauSchritt(now) {
  if (!aufbau) return;
  const t = bauHalt ?? (now - aufbau.t0) / 1000;
  let fertig = true;
  for (const u of aufbau.einheiten) {
    const k = clamp((t - u.delay) / u.dauer, 0, 1);
    if (k < 1) fertig = false;
    if (u.fertig && bauHalt === null) continue;             // steht schon: nicht mehr anfassen (der Zug fährt los)
    setzeAufbau(u, k);
    u.fertig = k >= 1;
  }
  const s = clamp((t - aufbau.ende + SCHATTEN_AB) / SCHATTEN_DAUER, 0, 1);
  SCHATTEN.value = s * s * (3 - 2 * s);
  if (fertig && s >= 1) { aufbau = null; performance.mark('gasse:aufbau-ende'); }
}
// Einheiten und Schnitt-Materialien schon vor dem ersten Bild, damit renderer.compile auch deren Shader übersetzt
let vorbereitet = RUHIG ? null : bauEinheiten();
let auftakt = true, anT0 = null;                            // anT0: ab da gehen die Lichter an (ms)
function starteAuftakt() {
  performance.mark('gasse:auftakt');
  auftakt = false;
  camera.position.copy(kugel(START.ziel, START.az - 0.4, Math.min(1.15, START.el + 0.3), START.dist * 1.7));
  fliege({ ...START, ziel: START.ziel.clone() }, () => { modus = 'uebersicht'; setzeGrenzen(START); }, 2400, true);
  if (!RUHIG) {
    aufbau = neuerAufbau(vorbereitet || bauEinheiten());
    vorbereitet = null;
    anT0 = aufbau.t0 + (aufbau.ende - 0.3) * 1000;          // Lichter gehen kurz vor dem Ende an (Runde 96)
    AN.value = -1;
    aufbauSchritt(aufbau.t0);
  }
  LADEN.fertig();
}
performance.mark('gasse:vorbereitet');
await pause();
// Shader vorab übersetzen, sonst stockt der Auftakt. Vorwärmen (Runde 43): Noch hinter dem deckenden Ladebildschirm
// einmal das ganze Diorama zeichnen, so liegen Geometrie und Bilder schon auf der Grafikkarte, wenn der Aufbau beginnt
// (vorher geschah das im ersten Bild des Auftakts). Dazu die Shader fürs Zeigen auf einen Laden und fürs Picking
// übersetzen, damit auch das erste Zeigen nicht hakt. Danach wartet der Auftakt, bis der Ladebildschirm seine
// Mindestzeit hatte (LADEN.bereit).
// Runde 92 (Livegang C): Übersetzt wird ohne zu warten, bis der Treiber fertig ist (compileAsync; beim ersten Besuch
// blockierte das sonst gut 60 ms), alles auf einmal. Picking und Verdeckung der Marker zeichnen in Ziele mit linearen
// Farben, dafür gibt es eine eigene Fassung der Shader: Die wird jetzt auch vorab übersetzt (vorher geschah das am Ende
// des Anflugs, als die Marker zum ersten Mal geprüft wurden, und dieses Bild dauerte doppelt so lang).
{
  const probe = LADEN_MESHES[TOUR[0]][0], vor = new THREE.Scene(), vorZiel = new THREE.Scene();
  if (probe) {
    [MAT.voxelHL, MAT.glasHL].forEach(m => vor.add(new THREE.Mesh(probe.geometry, m)));
    [pickMat, posMat].forEach(m => vorZiel.add(new THREE.Mesh(probe.geometry, m)));
  }
  const fertig = [renderer.compileAsync(scene, camera), renderer.compileAsync(vor, camera)];
  renderer.setRenderTarget(vRT);
  fertig.push(renderer.compileAsync(vorZiel, camera));      // übersetzt sofort, danach wird nur gewartet
  renderer.setRenderTarget(null);
  await Promise.all(fertig);
  performance.mark('gasse:compile');
  kamera(performance.now(), 0);
  renderer.render(scene, camera);
}
performance.mark('gasse:warm');
// Runde 94: Unterseiten im Ladebildschirm aufwärmen (SEITE.aufwaermen), nur am Rechner, nicht beim direkten Einstieg
// und nicht mit „Daten sparen“; die letzten Prozent zählen die Seiten
if (!SCHMAL.matches && matchMedia('(pointer: fine)').matches && !SEITE.direktEinstieg && !navigator.connection?.saveData) {
  await SEITE.aufwaermen((n, von) => LADEN.fortschritt(0.95 + 0.05 * n / von, true));
  performance.mark('gasse:seiten');
}
await LADEN.bereit();
performance.mark('gasse:bereit');

// ---------------------------------------------------------------- Schleife
let letzterPick = 0, vorher = performance.now();
renderer.setAnimationLoop(async now => {
  if (SEITE.verdeckt) { vorher = now; return; }             // Unterseite deckt die Gasse: nichts zeichnen (Runde 62);
  if (auftakt) starteAuftakt();                             // nach direktem Einstieg beginnt der Auftakt beim Schließen
  const dt = Math.min(0.1, (now - vorher) / 1000);
  vorher = now;
  kamera(now, dt);
  riesenrad(dt);
  zug(dt);
  saugroboter(dt);
  aufbauSchritt(now);
  ZEIT.value = now / 1000 % 3600;
  if (anT0 !== null && (AN.value = (now - anT0) / 1000) > 3) { AN.value = 1e4; anT0 = null; }
  sonnenSchatten();
  renderer.render(scene, camera);
  zeichneMarker();
  if (modus === 'uebersicht' && !vLaeuft && now - vZeit > 150) { vZeit = now; pruefeVerdeckung(); }
  // Hover nur in der Übersicht, nur wenn sich die Maus bewegt hat, höchstens alle 100 ms
  if (modus === 'uebersicht' && maus && neueMaus && !ziehen && now - letzterPick > 100) {
    letzterPick = now; neueMaus = false;
    const r = await pick(maus.x, maus.y);
    if (r !== undefined && modus === 'uebersicht') setHover(r);
  }
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  setzePlatz(!!raum);
  setFov(ist.hfov);
  pruefeMehr();
});
